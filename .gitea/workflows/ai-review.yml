name: Codex AI review
run-name: "AI Review PR #${{ gitea.event.inputs.pr_number || gitea.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR number to review, including a merged PR
        required: true
        type: string

# Windows Server trial profile for trusted, same-repository PRs only.
permissions:
  contents: read
  issues: write
  pull-requests: read

defaults:
  run:
    shell: powershell

jobs:
  review:
    if: ${{ gitea.event_name == 'workflow_dispatch' || gitea.event.pull_request.head.repo.full_name == gitea.repository }}
    runs-on: ai-review-windows
    env:
      REVIEWER_EXE: C:\gitea\ai-review\.venv\Scripts\gitea-auto-reviewer.exe
      UV_EXE: C:\gitea\ai-review\.venv\Scripts\uv.exe
      CI_PYTHON: .\.venv-ci\Scripts\python.exe
      GITNEXUS_EXE: C:\Users\GiteaAIReview\AppData\Roaming\npm\gitnexus.cmd
      AI_REVIEW_FIRST_PASS_EFFORT: ${{ vars.AI_REVIEW_FIRST_PASS_EFFORT }}
      AI_REVIEW_PLAN_EFFORT: ${{ vars.AI_REVIEW_PLAN_EFFORT }}
      AI_REVIEW_VERIFY_EFFORT: ${{ vars.AI_REVIEW_VERIFY_EFFORT }}
    steps:
      - name: Resolve PR metadata
        id: metadata
        env:
          METADATA_GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ gitea.api_url }}
          REPOSITORY: ${{ gitea.repository }}
          EVENT_PR_NUMBER: ${{ gitea.event.pull_request.number }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          $prNumber = if ($env:MANUAL_PR_NUMBER) { $env:MANUAL_PR_NUMBER } else { $env:EVENT_PR_NUMBER }
          & $env:REVIEWER_EXE metadata `
            --gitea-url "$env:GITEA_API_URL" `
            --repository "$env:REPOSITORY" `
            --pr "$prNumber" `
            --token-env "METADATA_GITEA_TOKEN" `
            --output-file "$env:GITHUB_OUTPUT"

      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base commit as data
        env:
          BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
        run: git fetch --no-tags origin $env:BASE_SHA

      - name: Index exact PR head with GitNexus
        env:
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
        run: |
          & $env:REVIEWER_EXE index `
            --head-sha "$env:HEAD_SHA" `
            --gitnexus-binary "$env:GITNEXUS_EXE"

      - name: Create isolated CI environment
        run: |
          & $env:UV_EXE venv --clear ".venv-ci" --python "C:\Python311\python.exe"
          & $env:UV_EXE pip install --python $env:CI_PYTHON -r "requirements-ci.txt"

      - name: Run Django system check
        env:
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          CHECK_FILE: ${{ runner.temp }}\gitea-auto-review-django.json
        run: |
          & $env:REVIEWER_EXE evidence `
            --head-sha "$env:HEAD_SHA" `
            --python "$env:CI_PYTHON" `
            --only "django_check" `
            --output "$env:CHECK_FILE"

      - name: Run migration check
        env:
          BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          CHECK_FILE: ${{ runner.temp }}\gitea-auto-review-migration.json
        run: |
          & $env:REVIEWER_EXE evidence `
            --head-sha "$env:HEAD_SHA" `
            --base-sha "$env:BASE_SHA" `
            --python "$env:CI_PYTHON" `
            --timeout 120 `
            --only "migration_check" `
            --output "$env:CHECK_FILE"

      - name: Run pytest
        env:
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          CHECK_FILE: ${{ runner.temp }}\gitea-auto-review-pytest.json
        run: |
          & $env:REVIEWER_EXE evidence `
            --head-sha "$env:HEAD_SHA" `
            --python "$env:CI_PYTHON" `
            --only "pytest" `
            --output "$env:CHECK_FILE"

      - name: Combine deterministic evidence
        env:
          DJANGO_FILE: ${{ runner.temp }}\gitea-auto-review-django.json
          MIGRATION_FILE: ${{ runner.temp }}\gitea-auto-review-migration.json
          PYTEST_FILE: ${{ runner.temp }}\gitea-auto-review-pytest.json
          EVIDENCE_FILE: ${{ runner.temp }}\gitea-auto-review-evidence.json
        run: |
          & $env:REVIEWER_EXE evidence-merge `
            --input "$env:DJANGO_FILE" `
            --input "$env:MIGRATION_FILE" `
            --input "$env:PYTEST_FILE" `
            --output "$env:EVIDENCE_FILE"

      - name: Show Codex reasoning settings
        run: "& $env:REVIEWER_EXE reasoning"

      - name: Generate first-pass Codex findings
        env:
          GITEA_TOKEN: ""
          REVIEW_FILE: ${{ runner.temp }}\gitea-auto-review-candidate.json
          EVIDENCE_FILE: ${{ runner.temp }}\gitea-auto-review-evidence.json
          REPOSITORY: ${{ gitea.repository }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          PR_TITLE: ${{ steps.metadata.outputs.pr_title }}
          BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          HEAD_REPOSITORY: ${{ steps.metadata.outputs.head_repository }}
        run: |
          & $env:REVIEWER_EXE review `
            --repository "$env:REPOSITORY" `
            --head-repository "$env:HEAD_REPOSITORY" `
            --pr "$env:PR_NUMBER" `
            --pr-title "$env:PR_TITLE" `
            --base-sha "$env:BASE_SHA" `
            --head-sha "$env:HEAD_SHA" `
            --evidence-file "$env:EVIDENCE_FILE" `
            --gitnexus-binary "$env:GITNEXUS_EXE" `
            --output "$env:REVIEW_FILE"

      - name: Plan rollback-only reproductions
        env:
          GITEA_TOKEN: ""
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          REVIEW_FILE: ${{ runner.temp }}\gitea-auto-review-candidate.json
          PLAN_FILE: ${{ runner.temp }}\gitea-auto-review-reproduction-plan.json
        run: |
          & $env:REVIEWER_EXE plan `
            --head-sha "$env:HEAD_SHA" `
            --review-file "$env:REVIEW_FILE" `
            --gitnexus-binary "$env:GITNEXUS_EXE" `
            --output "$env:PLAN_FILE"

      # Executes selected Django code against the configured test DB. Every
      # case runs in transaction.atomic(), is forced to roll back, and must
      # pass a fresh-connection cleanup check before it can be published.
      - name: Reproduce candidate findings with rollback
        env:
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          PLAN_FILE: ${{ runner.temp }}\gitea-auto-review-reproduction-plan.json
          REPRODUCTION_FILE: ${{ runner.temp }}\gitea-auto-review-reproduction.json
        run: |
          & $env:REVIEWER_EXE reproduce `
            --head-sha "$env:HEAD_SHA" `
            --plan-file "$env:PLAN_FILE" `
            --python "$env:CI_PYTHON" `
            --require-setting "ERP_LIVE_SEND=false" `
            --require-setting "MAIN_APP_RUN=false" `
            --output "$env:REPRODUCTION_FILE"

      - name: Verify reproduced findings with Codex
        env:
          GITEA_TOKEN: ""
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          CANDIDATE_FILE: ${{ runner.temp }}\gitea-auto-review-candidate.json
          REPRODUCTION_FILE: ${{ runner.temp }}\gitea-auto-review-reproduction.json
          VERIFICATION_FILE: ${{ runner.temp }}\gitea-auto-review-verification.json
        run: |
          & $env:REVIEWER_EXE verify `
            --head-sha "$env:HEAD_SHA" `
            --review-file "$env:CANDIDATE_FILE" `
            --reproduction-file "$env:REPRODUCTION_FILE" `
            --gitnexus-binary "$env:GITNEXUS_EXE" `
            --output "$env:VERIFICATION_FILE"

      - name: Keep only reproduced findings
        env:
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          CANDIDATE_FILE: ${{ runner.temp }}\gitea-auto-review-candidate.json
          REPRODUCTION_FILE: ${{ runner.temp }}\gitea-auto-review-reproduction.json
          VERIFICATION_FILE: ${{ runner.temp }}\gitea-auto-review-verification.json
          REVIEW_FILE: ${{ runner.temp }}\gitea-auto-review.json
        run: |
          & $env:REVIEWER_EXE finalize `
            --head-sha "$env:HEAD_SHA" `
            --review-file "$env:CANDIDATE_FILE" `
            --reproduction-file "$env:REPRODUCTION_FILE" `
            --verification-file "$env:VERIFICATION_FILE" `
            --output "$env:REVIEW_FILE"

      - name: Post or update PR comment
        env:
          GITEA_REVIEW_TOKEN: ${{ secrets.AI_REVIEW_GITEA_TOKEN }}
          REVIEW_FILE: ${{ runner.temp }}\gitea-auto-review.json
          GITEA_API_URL: ${{ gitea.api_url }}
          REPOSITORY: ${{ gitea.repository }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          PR_TITLE: ${{ steps.metadata.outputs.pr_title }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
        run: |
          & $env:REVIEWER_EXE comment `
            --gitea-url "$env:GITEA_API_URL" `
            --repository "$env:REPOSITORY" `
            --pr "$env:PR_NUMBER" `
            --pr-title "$env:PR_TITLE" `
            --head-sha "$env:HEAD_SHA" `
            --review-file "$env:REVIEW_FILE"

      # Debugging aid: the job workspace under runner.temp is cleaned up once the
      # job finishes, which makes it hard to inspect intermediate pipeline output
      # after the fact. Keep a copy of the last run's JSON artifacts regardless of
      # whether earlier steps failed.
      - name: Preserve last-run debug artifacts
        if: always()
        env:
          TMP_DIR: ${{ runner.temp }}
        run: |
          $debug = Join-Path "C:\gitea\ai-review\debug-runs" "$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force $debug | Out-Null
          Copy-Item "$env:TMP_DIR\gitea-auto-review*.json" $debug -ErrorAction SilentlyContinue
          Write-Output "Debug artifacts: $debug"
